  <script>
    // Tenta automaticamente variações comuns do nome do arquivo de capa antes de exibir o visual de reserva
    window.__tryNextCover = function (img, fallbackEl) {
      var list = ["./capa.png.PNG", "./capa.png", "./capa.PNG", "./capa.jpg"];
      var idx = Number(img.getAttribute("data-try") || "0") + 1;
      if (idx < list.length) {
        img.setAttribute("data-try", String(idx));
        img.src = list[idx];
      } else {
        img.classList.add("hidden");
        if (fallbackEl) fallbackEl.classList.remove("hidden");
      }
    };

  <script>
    (function () {
      "use strict";

      /* =========================================================================
       * 1. CONTROLE DA TELA DE APRESENTAÇÃO INICIAL (SPLASH)
       * ========================================================================= */
      const splashEl = document.getElementById("splashScreen");
      let splashTimer = null;

      function hideSplash() {
        if (!splashEl || splashEl.classList.contains("hidden")) return;
        if (splashTimer) clearTimeout(splashTimer);
        splashEl.classList.add("splash-hide");
        setTimeout(() => {
          splashEl.classList.add("hidden");
          splashEl.classList.remove("splash-hide");
        }, 380);
      }

      function showSplash(autoClose) {
        if (!splashEl) return;
        splashEl.classList.remove("hidden", "splash-hide");
        if (splashTimer) clearTimeout(splashTimer);
        if (autoClose) {
          splashTimer = setTimeout(hideSplash, 2300);
        }
      }

      document.getElementById("btnEnterApp").onclick = hideSplash;
      splashEl.onclick = e => {
        if (e.target === splashEl) hideSplash();
      };
      // Fecha automaticamente após 2,3s na abertura inicial
      splashTimer = setTimeout(hideSplash, 2300);

      /* =========================================================================
       * 2. DADOS E CONSTANTES DA ESCALA
       * ========================================================================= */
      const MN = [
        "Janeiro", "Fevereiro", "Março", "Abril", "Maio", "Junho",
        "Julho", "Agosto", "Setembro", "Outubro", "Novembro", "Dezembro"
      ];
      const WD = [
        "Domingo", "Segunda-feira", "Terça-feira", "Quarta-feira",
        "Quinta-feira", "Sexta-feira", "Sábado"
      ];
      const WDS = ["Dom", "Seg", "Ter", "Qua", "Qui", "Sex", "Sáb"];

      const FN = {
        SV:   ["Serviço 24h",            "#facc15", "#0f172a"],
        SVID: ["Serviço Extra Diurno",   "#4f46e5", "#ffffff"],
        SVIN: ["Serviço Extra Noturno",  "#dc2626", "#ffffff"],
        SEDE: ["Serviço na Sede",        "#0891b2", "#ffffff"],
        MIS:  ["Missão Oficial",         "#15803d", "#ffffff"],
        C:    ["Curso / Capacitação",    "#9333ea", "#ffffff"],
        JM:   ["Junta Médica",           "#db2777", "#ffffff"],
        F:    ["Férias Regulamentares",  "#1e293b", "#ffffff"]
      };

      const SERV = ["SV", "SVID", "SVIN", "SEDE"];
      const AWAY = ["MIS", "C", "JM", "F"];
      const ORDER = [...SERV, ...AWAY];

      const R = (a, b, c) => {
        const o = {};
        for (let i = a; i <= b; i++) o[i] = c;
        return o;
      };
      const S = (...p) => Object.assign({}, ...p);

      /* Chave "ano-mês" (mês de 0 a 11). 2026-10 = Novembro/2026 | 2026-11 = Dezembro/2026 */
      const DATA = {
        "2026-10": [
          ["3º SGT PM", "THYAGO",         { 2: "SV", 5: "SVIN", 7: "SV", 10: "SVIN", 12: "SV", 16: "SVID", 17: "SV", 18: "SEDE", 22: "SV", 27: "SV" }],
          ["CB PM",     "EILTON CARDOSO", { 1: "SV", 6: "SV", 10: "SVID", 11: "SV", 16: "SV", 20: "SVID", 21: "SV", 26: "SV" }],
          ["SD PM",     "PESSOA",         S({ 5: "SV", 18: "SV", 23: "SV", 25: "SVIN", 28: "SV", 30: "SVIN" }, R(8, 17, "MIS"))],
          ["CB PM",     "HERINALDO",      S({ 1: "MIS", 2: "MIS", 4: "SV", 6: "SVIN", 9: "SV", 10: "SVIN", 14: "SV" }, R(16, 30, "F"))],
          ["SD PM",     "D SILVA",        S(R(1, 20, "F"), { 22: "SV", 26: "SVID", 27: "SV", 30: "SVID" })],
          ["SD PM",     "WHATILAS",       S({ 2: "SV", 5: "SVIN", 7: "SV", 11: "SEDE", 12: "SV", 13: "SEDE", 14: "SVIN" }, R(15, 30, "F"))],
          ["CB PM",     "VELOSO",         { 4: "SV", 9: "SV", 14: "SV", 19: "SV", 20: "SVIN", 21: "SVIN", 24: "SV", 29: "SV" }],
          ["SD PM",     "KASSIO SILVA",   S(R(1, 9, "MIS"), { 10: "SVID", 11: "SV", 15: "SV", 20: "SV", 25: "SV", 26: "SVIN", 30: "SV" })],
          ["SD PM",     "PEDROSO",        { 3: "SV", 5: "SVID", 8: "SV", 13: "SV", 18: "SV", 23: "SV", 25: "SVID", 28: "SV" }],
          ["SD PM",     "BALBINA",        S({ 3: "SV", 6: "SVID", 8: "SV", 13: "SV", 17: "SV", 21: "SVID" }, R(23, 30, "MIS"))]
        ],
        "2026-11": [
          ["3º SGT PM", "THYAGO",         S({ 1: "SVID", 2: "SV", 6: "SVID", 7: "SV", 11: "SVID", 12: "SV", 14: "SEDE" }, R(15, 31, "F"))],
          ["SD PM",     "EILTON CARDOSO", S(R(1, 20, "F"), { 21: "SV", 24: "SVIN", 26: "SV" }, R(28, 31, "MIS"))],
          ["SD PM",     "VELOSO",         { 3: "SVID", 4: "SV", 9: "SV", 12: "SVIN", 14: "SV", 18: "SV", 23: "SV", 28: "SV" }],
          ["SD PM",     "HERINALDO",      S({ 1: "SV", 3: "SVIN", 5: "SV", 22: "SV", 25: "SVID", 27: "SV", 31: "SV" }, R(7, 21, "MIS"))],
          ["SD PM",     "KASSIO SILVA",   S({ 5: "SV" }, R(9, 31, "MIS"))],
          ["SD PM",     "BALBINA",        S(R(1, 7, "MIS"), { 9: "SV", 13: "SV", 18: "SV", 19: "SVIN", 23: "SV", 25: "SVIN", 28: "SV" })],
          ["SD PM",     "PESSOA",         { 4: "SV", 7: "SVID", 10: "SV", 11: "SVIN", 14: "SV", 19: "SV", 24: "SV", 29: "SV" }],
          ["SD PM",     "PEDROSO",        { 3: "SV", 6: "SVIN", 8: "SV", 12: "SVID", 13: "SV", 17: "SV", 22: "SV", 26: "SV" }],
          ["SD PM",     "D SILVA",        S({ 2: "SV", 15: "SV", 16: "SVIN", 20: "SV", 24: "SVID", 25: "SV", 30: "SV" }, R(7, 14, "MIS"))],
          ["SD PM",     "WHATILAS",       S(R(1, 15, "F"), { 16: "SVID", 19: "SV", 20: "SVIN" }, R(21, 31, "MIS"))]
        ]
      };

      /* =========================================================================
       * 3. ESTADO DA APLICAÇÃO E UTILITÁRIOS
       * ========================================================================= */
      const $ = id => document.getElementById(id);
      const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
      const pad2 = n => (n < 10 ? "0" + n : String(n));
      const iso = d => `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;

      function makeDate(y, m, d) {
        return new Date(y, m, d, 12, 0, 0, 0);
      }

      function getToday() {
        const t = new Date();
        return makeDate(t.getFullYear(), t.getMonth(), t.getDate());
      }

      let cur = getToday();
      let activeTab = "day";
      let folgaOpen = false;
      let myName = "";
      let toastTimer = null;

      try {
        myName = localStorage.getItem("escala5gpm_me") || "";
        // Migra nomes antigos salvos no aparelho para a grafia oficial
        if (myName === "KASSIO") myName = "KASSIO SILVA";
        if (myName === "PEDROZO") myName = "PEDROSO";
      } catch (e) {}

      function showToast(msg) {
        const el = $("toast");
        el.textContent = msg;
        el.classList.remove("hidden");
        if (toastTimer) clearTimeout(toastTimer);
        toastTimer = setTimeout(() => el.classList.add("hidden"), 2500);
      }

      function copyText(text, successMsg) {
        try {
          const ta = document.createElement("textarea");
          ta.value = text;
          ta.setAttribute("readonly", "");
          ta.style.position = "fixed";
          ta.style.left = "-9999px";
          document.body.appendChild(ta);
          ta.select();
          document.execCommand("copy");
          document.body.removeChild(ta);
          showToast(successMsg || "Copiado com sucesso!");
        } catch (err) {
          showToast("Não foi possível copiar automaticamente.");
        }
      }

      function getAllPersonnel() {
        const map = new Map();
        // Percorre do mês mais recente para o mais antigo para priorizar a graduação atual
        const keys = Object.keys(DATA).sort().reverse();
        keys.forEach(key => {
          DATA[key].forEach(o => {
            if (!map.has(o[1])) map.set(o[1], o[0]);
          });
        });
        return Array.from(map.entries()).map(([name, rank]) => ({ rank, name }));
      }

      function populateMeSelect() {
        const sel = $("meSelect");
        const people = getAllPersonnel();
        sel.innerHTML = '<option value="">Selecionar meu nome...</option>' +
          people.map(p => `<option value="${esc(p.name)}">${esc(p.rank)} ${esc(p.name)}</option>`).join("");
        sel.value = myName;
        $("btnMyMonth").classList.toggle("hidden", !myName);
      }

      function renderNextServiceBanner() {
        const box = $("nextServiceBanner");
        if (!myName) {
          box.classList.add("hidden");
          return;
        }

        const today = getToday();
        let found = null;

        for (let offset = 0; offset <= 45; offset++) {
          const d = new Date(today.getTime());
          d.setDate(d.getDate() + offset);
          const list = DATA[`${d.getFullYear()}-${d.getMonth()}`];
          if (!list) continue;
          const pm = list.find(o => o[1] === myName);
          if (!pm) continue;
          const code = pm[2][d.getDate()];
          if (code && SERV.includes(code)) {
            found = { date: d, offset, code };
            break;
          }
        }

        box.classList.remove("hidden");

        if (!found) {
          box.innerHTML = `
            <span class="text-xs text-slate-500 dark:text-slate-400">
              Nenhum serviço futuro encontrado nas escalas publicadas.
            </span>`;
          return;
        }

        const f = FN[found.code] || [found.code, "#e2e8f0", "#0f172a"];
        let whenText = "";
        if (found.offset === 0) whenText = "Hoje";
        else if (found.offset === 1) whenText = "Amanhã";
        else whenText = `Em ${found.offset} dias (${pad2(found.date.getDate())}/${pad2(found.date.getMonth() + 1)})`;

        box.innerHTML = `
          <div class="flex items-center gap-2 min-w-0">
            <span class="px-2 py-0.5 rounded-md text-[11px] font-extrabold shrink-0" style="background:${f[1]};color:${f[2]}">${esc(found.code)}</span>
            <span class="text-xs font-semibold text-slate-700 dark:text-slate-200 truncate">
              Próximo serviço: <b class="text-slate-900 dark:text-white">${esc(whenText)}</b>
            </span>
          </div>
          <button id="btnJumpNext" type="button" class="shrink-0 text-xs font-bold text-amber-600 dark:text-amber-400 hover:underline">
            Ver dia →
          </button>`;

        $("btnJumpNext").onclick = () => {
          cur = found.date;
          setTab("day");
          renderAll();
        };
      }

      /* =========================================================================
       * 4. RENDERIZAÇÃO DA VISÃO DIÁRIA
       * ========================================================================= */
      function getDayGroups(y, m, d) {
        const list = DATA[`${y}-${m}`];
        if (!list) return null;
        const g = {};
        list.forEach(o => {
          const c = o[2][d] || "";
          if (!g[c]) g[c] = [];
          g[c].push(o);
        });
        return g;
      }

      function updateQuickButtons() {
        const today = getToday();
        const diffDays = Math.round((cur.getTime() - today.getTime()) / 86400000);

        const setBtnStyle = (id, active, isTodayBtn) => {
          const el = $(id);
          if (active) {
            el.className = isTodayBtn
              ? "py-2.5 px-2 rounded-xl text-sm font-extrabold border border-amber-400 bg-amber-400 text-slate-950 shadow-sm transition active:scale-95"
              : "py-2.5 px-2 rounded-xl text-sm font-extrabold border border-slate-900 dark:border-amber-400 bg-slate-900 dark:bg-amber-400 text-white dark:text-slate-950 shadow-sm transition active:scale-95";
          } else {
            el.className = "py-2.5 px-2 rounded-xl text-sm font-bold border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 text-slate-700 dark:text-slate-200 hover:bg-slate-50 dark:hover:bg-slate-800 transition active:scale-95";
          }
        };

        setBtnStyle("btnYesterday", diffDays === -1, false);
        setBtnStyle("btnToday", diffDays === 0, true);
        setBtnStyle("btnTomorrow", diffDays === 1, false);
      }

      function renderPmRow(pm) {
        const isMe = myName && pm[1] === myName;
        const highlight = isMe
          ? "bg-amber-50/90 dark:bg-amber-400/10 ring-1 ring-inset ring-amber-400/50"
          : "hover:bg-slate-50 dark:hover:bg-slate-800/60";
        const badgeMe = isMe
          ? '<span class="ml-1.5 px-1.5 py-0.5 rounded-md bg-amber-400 text-slate-950 text-[10px] font-extrabold uppercase tracking-wide">Você</span>'
          : "";

        return `
          <button type="button" data-pm="${esc(pm[1])}"
            class="pm-row w-full text-left px-4 py-3 border-t border-slate-100 dark:border-slate-800 flex items-center justify-between gap-2 transition ${highlight}">
            <div class="flex items-baseline flex-wrap gap-x-2 min-w-0">
              <span class="text-xs font-semibold text-slate-500 dark:text-slate-400 shrink-0">${esc(pm[0])}</span>
              <span class="text-base font-extrabold text-slate-900 dark:text-white uppercase truncate">${esc(pm[1])}</span>
              ${badgeMe}
            </div>
            <svg class="w-4 h-4 text-slate-400 shrink-0" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
              <path d="M9 18l6-6-6-6"/>
            </svg>
          </button>`;
      }

      function renderDay() {
        try {
          const y = cur.getFullYear();
          const m = cur.getMonth();
          const d = cur.getDate();
          const g = getDayGroups(y, m, d);

          $("dp").value = iso(cur);
          updateQuickButtons();

          const diffDays = Math.round((cur.getTime() - getToday().getTime()) / 86400000);
          let relLabel = String(y);
          if (diffDays === 0) relLabel = `${y} · Hoje`;
          else if (diffDays === 1) relLabel = `${y} · Amanhã`;
          else if (diffDays === -1) relLabel = `${y} · Ontem`;

          $("dt").textContent = `${WD[cur.getDay()]}, ${d} de ${MN[m]}`;
          $("sb").textContent = relLabel;

          if (!g) {
            $("summaryBadges").innerHTML = "";
            $("out").innerHTML = `
              <div class="p-5 rounded-2xl bg-red-50 dark:bg-red-950/40 border border-red-200 dark:border-red-900/60 text-red-800 dark:text-red-300 text-sm font-bold text-center">
                A escala de ${esc(MN[m])} de ${y} ainda não foi publicada.
              </div>`;
            return;
          }

          const totalServ = SERV.reduce((acc, c) => acc + (g[c] ? g[c].length : 0), 0);
          let badgesHtml = `
            <span class="px-2.5 py-1 rounded-full bg-slate-900 dark:bg-slate-800 text-white text-xs font-bold">
              ${totalServ} de serviço
            </span>`;

          ORDER.forEach(c => {
            if (!g[c] || !g[c].length) return;
            const f = FN[c];
            badgesHtml += `
              <span class="px-2 py-1 rounded-full text-xs font-extrabold" style="background:${f[1]};color:${f[2]}">
                ${g[c].length} ${esc(c)}
              </span>`;
          });
          $("summaryBadges").innerHTML = badgesHtml;

          let html = "";

          const activeServKeys = SERV.filter(c => g[c] && g[c].length);
          if (activeServKeys.length) {
            html += `<div class="text-[11px] font-extrabold uppercase tracking-wider text-slate-500 dark:text-slate-400 px-1 pt-1">Em Serviço</div>`;
            activeServKeys.forEach(c => {
              const f = FN[c];
              html += `
                <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl shadow-sm overflow-hidden" style="border-left: 5px solid ${f[1]}">
                  <div class="px-4 py-2.5 flex items-center justify-between gap-2">
                    <div class="flex items-center gap-2.5">
                      <span class="min-w-[52px] text-center px-2 py-0.5 rounded-lg text-xs font-extrabold" style="background:${f[1]};color:${f[2]}">${esc(c)}</span>
                      <span class="text-sm font-bold text-slate-800 dark:text-slate-200">${esc(f[0])}</span>
                    </div>
                    <span class="text-xs font-bold text-slate-400">${g[c].length}</span>
                  </div>
                  ${g[c].map(pm => renderPmRow(pm)).join("")}
                </div>`;
            });
          } else {
            html += `
              <div class="p-4 rounded-2xl bg-amber-50 dark:bg-amber-950/30 border border-amber-200 dark:border-amber-900/50 text-amber-800 dark:text-amber-300 text-sm font-bold text-center">
                Ninguém escalado para serviço neste dia.
              </div>`;
          }

          const otherKeys = [
            ...AWAY.filter(c => g[c] && g[c].length),
            ...Object.keys(g).filter(c => c && !ORDER.includes(c))
          ];
          if (otherKeys.length) {
            html += `<div class="text-[11px] font-extrabold uppercase tracking-wider text-slate-500 dark:text-slate-400 px-1 pt-2">Missões e Afastamentos</div>`;
            otherKeys.forEach(c => {
              const f = FN[c] || [c, "#64748b", "#ffffff"];
              html += `
                <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl shadow-sm overflow-hidden opacity-95">
                  <div class="px-4 py-2.5 flex items-center justify-between gap-2">
                    <div class="flex items-center gap-2.5">
                      <span class="min-w-[52px] text-center px-2 py-0.5 rounded-lg text-xs font-extrabold" style="background:${f[1]};color:${f[2]}">${esc(c)}</span>
                      <span class="text-sm font-semibold text-slate-700 dark:text-slate-300">${esc(f[0])}</span>
                    </div>
                    <span class="text-xs font-bold text-slate-400">${g[c].length}</span>
                  </div>
                  ${g[c].map(pm => renderPmRow(pm)).join("")}
                </div>`;
            });
          }

          if (g[""] && g[""].length) {
            const countFolga = g[""].length;
            const meInFolga = myName && g[""].some(pm => pm[1] === myName);
            html += `
              <div class="pt-1">
                <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl overflow-hidden">
                  <button id="btnToggleFolga" type="button"
                    class="w-full px-4 py-3 flex items-center justify-between gap-2 text-left hover:bg-slate-50 dark:hover:bg-slate-800/60 transition">
                    <div class="flex items-center gap-2">
                      <span class="px-2 py-0.5 rounded-lg bg-slate-200 dark:bg-slate-800 text-slate-600 dark:text-slate-300 text-xs font-extrabold">—</span>
                      <span class="text-sm font-bold text-slate-600 dark:text-slate-300">
                        Sem escala / Folga (${countFolga})
                      </span>
                      ${meInFolga ? '<span class="px-1.5 py-0.5 rounded-md bg-emerald-100 dark:bg-emerald-900/50 text-emerald-700 dark:text-emerald-300 text-[10px] font-extrabold">Você folga</span>' : ''}
                    </div>
                    <svg class="w-4 h-4 text-slate-400 transition-transform ${folgaOpen ? 'rotate-180' : ''}" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
                      <path d="M6 9l6 6 6-6"/>
                    </svg>
                  </button>
                  <div id="folgaList" class="${folgaOpen ? '' : 'hidden'}">
                    ${g[""].map(pm => renderPmRow(pm)).join("")}
                  </div>
                </div>
              </div>`;
          }

          $("out").innerHTML = html;

          const toggleBtn = $("btnToggleFolga");
          if (toggleBtn) {
            toggleBtn.onclick = () => {
              folgaOpen = !folgaOpen;
              renderDay();
            };
          }
          document.querySelectorAll("#out .pm-row").forEach(btn => {
            btn.onclick = () => openPmModal(btn.getAttribute("data-pm"));
          });
        } catch (err) {
          $("out").innerHTML = '<div class="p-4 rounded-2xl bg-red-100 text-red-800 font-bold text-center">Erro ao carregar a escala do dia.</div>';
        }
      }

      /* =========================================================================
       * 5. RENDERIZAÇÃO DO CALENDÁRIO MENSAL
       * ========================================================================= */
      function renderMonth() {
        const y = cur.getFullYear();
        const m = cur.getMonth();
        const list = DATA[`${y}-${m}`];
        const today = getToday();

        $("calTitle").textContent = `${MN[m]} de ${y}`;
        $("calSub").textContent = myName
          ? `Destacando escala de ${myName}`
          : (list ? "Quantidade de militares de serviço por dia" : "Escala ainda não publicada");

        const firstDay = new Date(y, m, 1).getDay();
        const daysInMonth = new Date(y, m + 1, 0).getDate();
        const meObj = (list && myName) ? list.find(o => o[1] === myName) : null;

        let html = "";
        for (let i = 0; i < firstDay; i++) {
          html += `<div class="h-14 rounded-xl bg-slate-50/60 dark:bg-slate-950/30"></div>`;
        }

        for (let d = 1; d <= daysInMonth; d++) {
          const isToday = today.getFullYear() === y && today.getMonth() === m && today.getDate() === d;
          const isSelected = cur.getDate() === d;

          let badgeHtml = "";
          if (list) {
            if (meObj) {
              const code = meObj[2][d];
              if (code) {
                const f = FN[code] || [code, "#64748b", "#ffffff"];
                badgeHtml = `<span class="mt-1 px-1 py-0.5 rounded text-[9px] font-extrabold leading-none truncate max-w-full" style="background:${f[1]};color:${f[2]}">${esc(code)}</span>`;
              } else {
                badgeHtml = `<span class="mt-1 text-[9px] text-slate-300 dark:text-slate-700 leading-none">—</span>`;
              }
            } else {
              let countServ = 0;
              list.forEach(o => {
                if (SERV.includes(o[2][d])) countServ++;
              });
              badgeHtml = countServ > 0
                ? `<span class="mt-1 px-1.5 py-0.5 rounded-full bg-amber-400/20 text-amber-700 dark:text-amber-300 text-[9px] font-extrabold leading-none">${countServ} SV</span>`
                : `<span class="mt-1 text-[9px] text-slate-300 dark:text-slate-700 leading-none">0</span>`;
            }
          }

          const borderClass = isSelected
            ? "border-amber-400 ring-2 ring-amber-400/40 bg-amber-50/70 dark:bg-amber-400/10"
            : isToday
              ? "border-slate-900 dark:border-slate-300 bg-slate-50 dark:bg-slate-800"
              : "border-slate-200/80 dark:border-slate-800 bg-white dark:bg-slate-900 hover:bg-slate-50 dark:hover:bg-slate-800";

          html += `
            <button type="button" data-day="${d}"
              class="cal-day h-14 p-1 rounded-xl border flex flex-col items-center justify-center transition active:scale-95 ${borderClass}">
              <span class="text-xs font-extrabold ${isToday ? 'text-amber-600 dark:text-amber-400' : 'text-slate-800 dark:text-slate-200'}">${d}</span>
              ${badgeHtml}
            </button>`;
        }

        $("calGrid").innerHTML = html;

        document.querySelectorAll("#calGrid .cal-day").forEach(btn => {
          btn.onclick = () => {
            const day = Number(btn.getAttribute("data-day"));
            cur = makeDate(y, m, day);
            setTab("day");
            renderAll();
          };
        });
      }

      /* =========================================================================
       * 6. MODAIS (INDIVIDUAL DO MILITAR, LEGENDA, INSTALAR)
       * ========================================================================= */
      function openModal(title, sub, bodyHtml) {
        $("modalTitle").textContent = title;
        $("modalSub").textContent = sub;
        $("modalBody").innerHTML = bodyHtml;
        $("modalBackdrop").classList.remove("hidden");
        $("modalBackdrop").classList.add("flex");
      }

      function closeModal() {
        $("modalBackdrop").classList.add("hidden");
        $("modalBackdrop").classList.remove("flex");
      }

      function openPmModal(name) {
        const y = cur.getFullYear();
        const m = cur.getMonth();
        const list = DATA[`${y}-${m}`];
        const pm = list ? list.find(o => o[1] === name) : null;

        if (!pm) {
          showToast("Militar não encontrado na escala deste mês.");
          return;
        }

        const daysObj = pm[2];
        const days = Object.keys(daysObj).map(Number).sort((a, b) => a - b);

        const counts = {};
        days.forEach(d => {
          const c = daysObj[d];
          counts[c] = (counts[c] || 0) + 1;
        });

        const isMe = myName === name;
        let countersHtml = Object.keys(counts).map(c => {
          const f = FN[c] || [c, "#64748b", "#ffffff"];
          return `<span class="px-2.5 py-1 rounded-lg text-xs font-extrabold" style="background:${f[1]};color:${f[2]}">${counts[c]} ${esc(c)}</span>`;
        }).join("");

        let listHtml = days.length
          ? days.map(d => {
              const dt = makeDate(y, m, d);
              const c = daysObj[d];
              const f = FN[c] || [c, "#64748b", "#ffffff"];
              return `
                <button type="button" data-jump-day="${d}"
                  class="pm-jump w-full px-3.5 py-2.5 rounded-xl bg-slate-50 dark:bg-slate-800/70 hover:bg-slate-100 dark:hover:bg-slate-800 border border-slate-200/70 dark:border-slate-700/70 flex items-center justify-between gap-2 transition">
                  <div class="flex items-center gap-2.5">
                    <span class="w-8 text-center font-extrabold text-sm text-slate-900 dark:text-white">${pad2(d)}</span>
                    <span class="text-xs font-semibold text-slate-500 dark:text-slate-400">${esc(WDS[dt.getDay()])}</span>
                  </div>
                  <div class="flex items-center gap-2">
                    <span class="text-xs text-slate-500 dark:text-slate-400 hidden sm:inline">${esc(f[0])}</span>
                    <span class="min-w-[48px] text-center px-2 py-0.5 rounded-md text-xs font-extrabold" style="background:${f[1]};color:${f[2]}">${esc(c)}</span>
                  </div>
                </button>`;
            }).join("")
          : '<p class="text-sm text-slate-500 text-center py-4">Sem escalas registradas neste mês.</p>';

        const bodyHtml = `
          <div class="flex flex-wrap gap-1.5">${countersHtml || '<span class="text-xs text-slate-400">Sem registros</span>'}</div>
          <div class="grid grid-cols-2 gap-2">
            <button id="btnPinMe" type="button"
              class="py-2.5 px-3 rounded-xl text-xs font-extrabold border transition ${isMe ? 'bg-slate-200 dark:bg-slate-800 text-slate-700 dark:text-slate-200 border-slate-300 dark:border-slate-700' : 'bg-amber-400 text-slate-950 border-amber-400'}">
              ${isMe ? 'Remover "Sou eu"' : 'Fixar como "Sou eu"'}
            </button>
            <button id="btnCopyPm" type="button"
              class="py-2.5 px-3 rounded-xl text-xs font-extrabold bg-slate-900 dark:bg-slate-700 text-white transition">
              Copiar meu mês
            </button>
          </div>
          <div class="space-y-1.5 pt-1">${listHtml}</div>
        `;

        openModal(`${pm[0]} ${pm[1]}`, `Escala completa — ${MN[m]} de ${y}`, bodyHtml);

        $("btnPinMe").onclick = () => {
          myName = isMe ? "" : name;
          try { localStorage.setItem("escala5gpm_me", myName); } catch (e) {}
          populateMeSelect();
          renderAll();
          closeModal();
          showToast(myName ? `Perfil fixado: ${myName}` : "Perfil removido");
        };

        $("btnCopyPm").onclick = () => {
          const lines = [
            `*ESCALA DO CURIÓZEIRO — 5º GPM*`,
            `*${pm[0]} ${pm[1]}* (${MN[m]}/${y})`,
            ""
          ];
          days.forEach(d => {
            const dt = makeDate(y, m, d);
            const c = daysObj[d];
            const f = FN[c] ? FN[c][0] : "";
            lines.push(`• *${pad2(d)}/${pad2(m + 1)} (${WDS[dt.getDay()]})*: ${c} — ${f}`);
          });
          copyText(lines.join("\n"), "Escala individual copiada!");
        };

        document.querySelectorAll("#modalBody .pm-jump").forEach(btn => {
          btn.onclick = () => {
            cur = makeDate(y, m, Number(btn.getAttribute("data-jump-day")));
            closeModal();
            setTab("day");
            renderAll();
          };
        });
      }

      function openLegendModal() {
        const rows = ORDER.map(c => {
          const f = FN[c];
          return `
            <div class="flex items-center gap-3 p-2.5 rounded-xl bg-slate-50 dark:bg-slate-800/70 border border-slate-200/70 dark:border-slate-700/70">
              <span class="min-w-[54px] text-center px-2 py-1 rounded-lg text-xs font-extrabold shrink-0" style="background:${f[1]};color:${f[2]}">${esc(c)}</span>
              <span class="text-sm font-semibold text-slate-800 dark:text-slate-200">${esc(f[0])}</span>
            </div>`;
        }).join("");

        openModal("Legenda das Siglas", "Significado de cada código na escala", `<div class="space-y-2">${rows}</div>`);
      }

      function openInstallModal() {
        const html = `
          <div class="space-y-3 text-sm text-slate-700 dark:text-slate-300 leading-relaxed">
            <div class="p-3.5 rounded-2xl bg-slate-50 dark:bg-slate-800/70 border border-slate-200 dark:border-slate-700">
              <p class="font-extrabold text-slate-900 dark:text-white mb-1">Android (Chrome / Edge)</p>
              <p>Toque no menu <b>⋮</b> no canto superior direito do navegador e escolha <b>Adicionar à tela inicial</b>.</p>
            </div>
            <div class="p-3.5 rounded-2xl bg-slate-50 dark:bg-slate-800/70 border border-slate-200 dark:border-slate-700">
              <p class="font-extrabold text-slate-900 dark:text-white mb-1">iPhone (Safari)</p>
              <p>Toque no botão <b>Compartilhar</b> (quadrado com seta para cima) e escolha <b>Adicionar à Tela de Início</b>.</p>
            </div>
            <div class="p-3.5 rounded-2xl bg-amber-50 dark:bg-amber-950/30 border border-amber-200 dark:border-amber-900/50 text-amber-900 dark:text-amber-200 text-xs font-medium">
              Dica: toque no brasão no canto superior esquerdo sempre que quiser rever a tela de apresentação do 5º GPM.
            </div>
          </div>`;
        openModal("Salvar como Aplicativo", "Acesso rápido direto da tela inicial", html);
      }

      /* =========================================================================
       * 7. COMPARTILHAMENTO WHATSAPP E TEMA
       * ========================================================================= */
      function buildWhatsAppText() {
        const y = cur.getFullYear();
        const m = cur.getMonth();
        const d = cur.getDate();
        const g = getDayGroups(y, m, d);
        if (!g) return null;

        const lines = [
          `*ESCALA DO CURIÓZEIRO — 5º GPM*`,
          `📅 ${WD[cur.getDay()]}, ${pad2(d)}/${pad2(m + 1)}/${y}`,
          ""
        ];

        const keys = [...ORDER, ...Object.keys(g).filter(c => c && !ORDER.includes(c))];
        keys.forEach(c => {
          const l = g[c];
          if (!l || !l.length) return;
          const f = FN[c];
          lines.push(`*[${c}] ${f ? f[0] : ""}*`);
          l.forEach(pm => {
            lines.push(`• ${pm[0]} *${pm[1]}*`);
          });
          lines.push("");
        });

        return lines.join("\n").trim();
      }

      function shareDay() {
        const text = buildWhatsAppText();
        if (!text) {
          showToast("Sem escala publicada para esta data.");
          return;
        }
        if (navigator.share) {
          navigator.share({
            title: "Escala do Curiózeiro — 5º GPM",
            text: text,
            url: "https://escaladocuriozeiro.tiiny.site"
          }).catch(() => {});
        } else {
          copyText(text + "\n\n🔗 https://escaladocuriozeiro.tiiny.site", "Escala formatada copiada para o WhatsApp!");
        }
      }

      function applyTheme(theme) {
        const root = document.documentElement;
        const isDark = theme === "dark";
        root.classList.toggle("dark", isDark);
        $("themeIcon").innerHTML = isDark
          ? `<svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>`
          : `<svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/></svg>`;
      }

      function initTheme() {
        let saved = null;
        try { saved = localStorage.getItem("escala5gpm_theme"); } catch (e) {}
        const prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
        applyTheme(saved || (prefersDark ? "dark" : "light"));
      }

      /* =========================================================================
       * 8. ABAS, NAVEGAÇÃO E EVENTOS
       * ========================================================================= */
      function setTab(tab) {
        activeTab = tab;
        const isDay = tab === "day";
        $("viewDay").classList.toggle("hidden", !isDay);
        $("viewMonth").classList.toggle("hidden", isDay);

        const activeCls = "py-2.5 px-3 rounded-xl text-sm font-extrabold bg-white dark:bg-slate-800 text-slate-900 dark:text-white shadow-sm transition flex items-center justify-center gap-1.5";
        const idleCls = "py-2.5 px-3 rounded-xl text-sm font-bold text-slate-500 dark:text-slate-400 hover:text-slate-800 dark:hover:text-slate-200 transition flex items-center justify-center gap-1.5";

        $("tabDay").className = isDay ? activeCls : idleCls;
        $("tabMonth").className = isDay ? idleCls : activeCls;
      }

      function renderAll() {
        renderNextServiceBanner();
        renderDay();
        renderMonth();
      }

      function goDays(delta) {
        cur.setDate(cur.getDate() + delta);
        renderAll();
      }

      function goMonths(delta) {
        cur = makeDate(cur.getFullYear(), cur.getMonth() + delta, 1);
        renderAll();
      }

      $("btnShowCover").onclick = () => showSplash(false);
      $("pv").onclick = () => goDays(-1);
      $("nx").onclick = () => goDays(1);
      $("btnYesterday").onclick = () => { const d = getToday(); d.setDate(d.getDate() - 1); cur = d; renderAll(); };
      $("btnToday").onclick = () => { cur = getToday(); renderAll(); };
      $("btnTomorrow").onclick = () => { const d = getToday(); d.setDate(d.getDate() + 1); cur = d; renderAll(); };

      $("dp").onchange = e => {
        const v = e.target.value;
        if (!v) return;
        const p = v.split("-").map(Number);
        if (p.length === 3) {
          cur = makeDate(p[0], p[1] - 1, p[2]);
          renderAll();
        }
      };

      $("tabDay").onclick = () => setTab("day");
      $("tabMonth").onclick = () => { setTab("month"); renderMonth(); };
      $("prevMonth").onclick = () => goMonths(-1);
      $("nextMonth").onclick = () => goMonths(1);

      $("meSelect").onchange = e => {
        myName = e.target.value;
        try { localStorage.setItem("escala5gpm_me", myName); } catch (err) {}
        $("btnMyMonth").classList.toggle("hidden", !myName);
        renderAll();
        if (myName) showToast(`Escala destacada para ${myName}`);
      };

      $("btnMyMonth").onclick = () => {
        if (myName) openPmModal(myName);
      };

      $("btnShare").onclick = shareDay;
      $("btnCopy").onclick = () => {
        const text = buildWhatsAppText();
        if (!text) showToast("Sem escala publicada para esta data.");
        else copyText(text, "Escala copiada para o WhatsApp!");
      };

      $("btnLegend").onclick = openLegendModal;
      $("btnInstall").onclick = openInstallModal;
      $("btnTheme").onclick = () => {
        const next = document.documentElement.classList.contains("dark") ? "light" : "dark";
        applyTheme(next);
        try { localStorage.setItem("escala5gpm_theme", next); } catch (e) {}
        showToast(next === "dark" ? "Tema escuro ativado" : "Tema claro ativado");
      };

      $("modalClose").onclick = closeModal;
      $("modalBackdrop").onclick = e => {
        if (e.target === $("modalBackdrop")) closeModal();
      };

      document.addEventListener("keydown", e => {
        if (e.key === "Escape") {
          closeModal();
          hideSplash();
        }
        if (document.activeElement && ["INPUT", "SELECT"].includes(document.activeElement.tagName)) return;
        if (activeTab === "day") {
          if (e.key === "ArrowLeft") goDays(-1);
          if (e.key === "ArrowRight") goDays(1);
        }
      });

      let touchX = 0;
      let touchY = 0;
      $("swipeArea").addEventListener("touchstart", e => {
        if (!e.touches || e.touches.length !== 1) return;
        touchX = e.touches[0].clientX;
        touchY = e.touches[0].clientY;
      }, { passive: true });

      $("swipeArea").addEventListener("touchend", e => {
        if (activeTab !== "day" || !e.changedTouches || e.changedTouches.length !== 1) return;
        const dx = e.changedTouches[0].clientX - touchX;
        const dy = e.changedTouches[0].clientY - touchY;
        if (Math.abs(dx) > 65 && Math.abs(dx) > Math.abs(dy) * 1.5) {
          goDays(dx < 0 ? 1 : -1);
        }
      }, { passive: true });

      initTheme();
      populateMeSelect();
      setTab("day");
      renderAll();
    })();
  </script>
</body>
</html>
